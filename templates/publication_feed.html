<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ publication.title }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    
    <style>
        .text-clamp {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-size: 14px;
            margin-top: 5px;
            line-height: 1.4;
        }

        #expand-toggle:checked ~ .text-clamp {
            -webkit-line-clamp: unset;
        }

        #expand-toggle:checked ~ .expand-btn::after {
            content: "Свернуть";
        }

        .expand-btn::after {
            content: "Развернуть";
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background: #000;">
    
    <div class="app-container" style="position: relative; width: 100%; max-width: 400px; height: 100vh; margin: 0 auto; overflow: hidden; background: #000;">
        
        <a href="/publications" style="position: absolute; top: 15px; left: 15px; color: white; font-size: 24px; text-decoration: none; z-index: 20;">←</a>
        
        <video autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover;">
            <source src="{{ publication.video_url }}" type="video/mp4">
        </video>
        
        <div style="position: absolute; bottom: 70px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 10;">
            
            <div style="flex: 1; margin-right: 15px; background: rgba(0, 0, 0, 0.45); padding: 12px; border-radius: 12px; color: white;">
                <strong style="font-size: 16px;">{{ publication.title }}</strong>
                
                <input type="checkbox" id="expand-toggle" style="display: none;">
                
                <div class="text-clamp">
                    {{ publication.description }}
                </div>
                
                <label for="expand-toggle" class="expand-btn" style="color: #005df9; font-weight: bold; cursor: pointer; display: block; margin-top: 5px; font-size: 13px;"></label>
                
                <div style="margin-top: 15px; font-size: 13px; text-align: right;">
                    <span style="color: #005df9; font-weight: bold;">Средняя длина: {{ publication.avg_length }}</span><br>
                    <span style="color: #005df9; font-weight: bold;">Доля уник. слов: {{ publication.unique_words_share }}</span>
                </div>
            </div>

            <div style="display: flex; flex-direction: column; align-items: center; gap: 15px; padding-bottom: 5px;">
                
                <div style="text-align: center; color: white;">
                    <div style="width: 45px; height: 45px; background: rgba(0,0,0,0.5); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 5px;">
                        ❤️
                    </div>
                    <span style="font-size: 12px; font-weight: bold;">{{ publication.likes_count }}</span>
                </div>
                
                <a href="/publications/{{ publication.id }}?next=true" style="text-align: center; color: white; text-decoration: none;">
                    <div style="width: 45px; height: 45px; background: rgba(0,0,0,0.5); border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 5px;">
                        ⏭
                    </div>
                    <span style="font-size: 12px; font-weight: bold;">Далее</span>
                </a>
            </div>
        </div>

        <!-- НИЖНЕЕ МЕНЮ: Лента, Добавление, Плитка -->
        <nav class="bottom-tab-bar">
            <a href="/publications/feed" {% if request.url.path == '/publications/feed' %}class="active"{% endif %}>ЛЕНТА</a>
            <a href="/publications/draft" {% if request.url.path == '/publications/draft' %}class="active"{% endif %}>ДОБАВЛЕНИЕ</a>
            <a href="/publications" {% if request.url.path == '/publications' %}class="active"{% endif %}>ПЛИТКА</a>
        </nav>
        
    </div>
</body>
</html>
