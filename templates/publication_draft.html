<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Добавление</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>Добавление (Черновик)</h1>
        </div>
        
        <div class="content">
            <!-- ФОРМА С МЕТОДОМ POST -->
            <form class="draft-form" action="/publications/draft" method="POST">
                
                <div class="draft-section draft-media">
                    <h3>Медиафайлы</h3>
                    <!-- По ТЗ: новые фото в этой лабе не сохраняются как файлы, используем URL -->
                    <img src="{{ publication.image_url if publication else 'http://localhost:9000/readability/news.jpg' }}" alt="Обложка">
                    
                    <label>URL изображения</label>
                    <input type="text" name="image_url" value="{{ publication.image_url if publication else '' }}">
                    
                    <label>URL видео</label>
                    <input type="text" name="video_url" value="{{ publication.video_url if publication else '' }}">
                </div>

                <div class="draft-section">
                    <h3>Информация о тексте</h3>
                    
                    <!-- ОБЯЗАТЕЛЬНО: атрибуты name для каждого поля -->
                    <label>Название</label>
                    <input type="text" name="title" value="{{ publication.title if publication else '' }}">
                    
                    <label>Жанр</label>
                    <input type="text" name="genre" value="{{ publication.genre if publication else '' }}">
                    
                    <label>Средняя длина</label>
                    <input type="number" name="avg_length" value="{{ publication.avg_length if publication else 0 }}">
                    
                    <label>Доля уникальных слов</label>
                    <input type="text" name="unique_words_share" value="{{ publication.unique_words_share if publication else '' }}">
                    
                    <label>Описание</label>
                    <textarea name="description">{{ publication.description if publication else '' }}</textarea>

                    <div style="display: flex; gap: 10px; margin-top: 15px;">
                        <button type="submit" class="btn-black-rounded" style="flex: 1;">Сохранить</button>
                    </div>
                </div>
            </form>

            <!-- КНОПКА ОПУБЛИКОВАТЬ (Отдельная форма) -->
            {% if publication %}
            <form action="/publications/{{ publication.id }}/publish" method="POST" style="margin-top: 10px;">
                <button type="submit" class="btn-black-rounded" style="width: 100%; background: #005df9;">Опубликовать</button>
            </form>
            {% endif %}
        </div>

        <nav class="bottom-tab-bar">
            <a href="/publications">Плитка</a>
            <a href="/publications/feed">Лента</a>
            <a href="/publications/draft" class="active">Добавление</a>
        </nav>
    </div>
</body>
</html>
